name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for NuGet trusted publishing: lets the runner mint an OIDC token
      # that nuget.org exchanges for a short-lived API key. No secret is stored.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=""
          [ -n "$VERSION" ] && ARGS="-p:Version=$VERSION"
          dotnet build --configuration Release --no-restore $ARGS

      - name: Test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=""
          [ -n "$VERSION" ] && ARGS="-p:Version=$VERSION"
          dotnet test --configuration Release --no-build --verbosity normal $ARGS

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=""
          [ -n "$VERSION" ] && ARGS="-p:Version=$VERSION"
          for project in \
            src/Umbraco.Community.Imaging.ImageSharp/Umbraco.Community.Imaging.ImageSharp.csproj \
            src/Umbraco.Community.Imaging.ImageSharp2/Umbraco.Community.Imaging.ImageSharp2.csproj
          do
            dotnet pack "$project" --configuration Release --no-build --output artifacts $ARGS
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      # Exchanges the workflow's OIDC token for a short-lived nuget.org API key.
      # Requires a trusted publishing policy on nuget.org for this repository, and
      # a NUGET_USER repository variable holding the nuget.org account name.
      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
